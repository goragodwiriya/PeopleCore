<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeopleCore — HRIS Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --ink: #19243a;
      --muted: #758198;
      --line: #e7ecf4;
      --primary: #5558e8;
      --primary-soft: #eeefff;
      --green: #138865;
      --green-soft: #e6f6ef;
      --orange: #b97713;
      --orange-soft: #fff4df;
      --red: #cc4960;
      --red-soft: #fff0f2;
      --nav: #142138;
      --radius: 16px;
      --shadow: 0 7px 24px rgba(30, 45, 75, .045);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    a { color: var(--primary); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 27px; letter-spacing: -.7px; margin-bottom: 4px; }
    h2 { font-size: 18px; margin-bottom: 16px; }
    h3 { font-size: 15px; margin-bottom: 10px; }
    small, .muted { color: var(--muted); }
    small { font-size: 12px; }
    strong { font-weight: 650; }
    :focus-visible { outline: 3px solid #a7acff; outline-offset: 3px; }

    .app { display: grid; grid-template-columns: 245px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      background: var(--nav);
      color: #dbe3f3;
      padding: 28px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .brand { padding: 0 10px; }
    .brand strong { display: block; font-size: 23px; color: white; }
    .brand span { font-size: 11px; letter-spacing: 2px; color: #91a3c2; }
    .nav-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #8195b6;
      padding: 0 12px;
      margin-bottom: 10px;
    }
    .nav { display: grid; gap: 6px; }
    .nav button {
      border: 0;
      background: transparent;
      color: #afbdd4;
      text-align: left;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav button.active { background: #313d67; color: white; }
    .nav button:hover { background: #24334e; color: white; }
    .nav-icon {
      width: 24px;
      height: 24px;
      border: 1px solid currentColor;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 11px;
    }
    .session {
      margin-top: auto;
      padding: 16px;
      background: #1c2b45;
      border-radius: 12px;
    }
    .session select {
      width: 100%;
      margin-top: 8px;
      background: #263752;
      color: white;
      border-color: #3a4b68;
    }
    .session small { color: #a8b7cf; }

    .main { min-width: 0; }
    .topbar {
      background: white;
      border-bottom: 1px solid var(--line);
      padding: 15px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .content { padding: 28px 32px 45px; max-width: 1700px; margin: auto; }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }
    .page-head p { color: var(--muted); margin-bottom: 0; }
    .notice {
      background: #fff9eb;
      border: 1px solid #f1e2be;
      color: #86621c;
      border-radius: 11px;
      padding: 10px 14px;
      margin-bottom: 23px;
      font-size: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 20px;
      min-width: 0;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-head h2 { margin: 0; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .stat .value { font-size: 32px; font-weight: 750; line-height: 1.3; margin: 10px 0; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; }
    .stat-mark {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 700;
    }
    .two-col { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar .search { flex: 1; min-width: 200px; }
    input, select, textarea {
      border: 1px solid #dbe2ed;
      border-radius: 9px;
      background: #fff;
      padding: 9px 11px;
      color: var(--ink);
      max-width: 100%;
    }
    textarea { resize: vertical; min-height: 86px; }
    input[readonly] { background: #f3f5f9; color: var(--muted); }
    .btn {
      border: 1px solid var(--line);
      background: white;
      color: #40506b;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn:hover { background: #f5f6fb; }
    .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn.danger { color: var(--red); background: var(--red-soft); border-color: #fad5dc; }
    .btn.small { padding: 5px 9px; font-size: 12px; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    .link-button { border: 0; padding: 0; color: var(--primary); background: transparent; text-align: left; }

    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th {
      text-align: left;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .2px;
      padding: 12px;
      background: #fafbfe;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fcfcff; }
    .person { display: flex; align-items: center; gap: 11px; }
    .avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: #eeefff;
      color: var(--primary);
      border-radius: 12px;
      font-weight: 700;
    }
    .avatar.large { width: 65px; height: 65px; font-size: 22px; border-radius: 18px; }
    .badge {
      display: inline-block;
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 11px;
      background: #edf1f7;
      color: #67748a;
    }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.orange { background: var(--orange-soft); color: var(--orange); }
    .badge.purple { background: var(--primary-soft); color: var(--primary); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      margin-top: 12px;
      padding-top: 16px;
    }
    .empty { text-align: center; color: var(--muted); padding: 35px; }
    .bar-row { margin-bottom: 18px; }
    .bar-label { display: flex; justify-content: space-between; margin-bottom: 7px; }
    .bar { height: 8px; background: #f0f2f8; border-radius: 20px; overflow: hidden; }
    .bar > span { height: 100%; display: block; background: #7477ee; border-radius: inherit; }

    .profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
    .profile-head h2 { margin: 0 0 5px; font-size: 22px; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow: auto; }
    .tab {
      border: 0;
      background: none;
      padding: 11px 13px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 25px; }
    .detail small { display: block; margin-bottom: 4px; }
    .detail div { white-space: pre-wrap; overflow-wrap: anywhere; }
    .timeline { border-left: 2px solid #e6e8fa; margin-left: 8px; padding-left: 23px; }
    .timeline-item { position: relative; padding-bottom: 25px; }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -30px;
      top: 7px;
      width: 12px;
      height: 12px;
      background: var(--primary);
      border: 3px solid #eeefff;
      border-radius: 50%;
    }
    .timeline-item h3 { margin: 6px 0; }
    .change { font-size: 13px; margin: 4px 0; }
    .tree ul { list-style: none; padding-left: 24px; border-left: 1px solid #dde3ee; margin: 0 0 0 14px; }
    .tree > ul { border: 0; padding-left: 0; margin-left: 0; }
    .tree li { padding: 7px 0; }
    .tree-node {
      display: inline-block;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafbff;
    }

    dialog {
      width: min(780px, calc(100% - 28px));
      border: 0;
      padding: 0;
      border-radius: 18px;
      color: var(--ink);
      box-shadow: 0 25px 90px #0f193d40;
      max-height: 90vh;
    }
    dialog::backdrop { background: #14213880; backdrop-filter: blur(3px); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 19px 24px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; }
    .modal-body { padding: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #58677f; }
    .field input, .field select, .field textarea { width: 100%; font-size: 14px; }
    .full { grid-column: 1 / -1; }
    .section-label {
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding-top: 22px; }
    .form-error {
      display: none;
      color: var(--red);
      background: var(--red-soft);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .form-error.show { display: block; }
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 13px 20px;
      background: #1d2d45;
      color: white;
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 100;
      display: none;
      max-width: min(440px, calc(100% - 40px));
    }
    #toast.show { display: block; }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 205px minmax(0, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
      .content { padding: 24px; }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: static; height: auto; padding: 16px; gap: 14px; }
      .brand strong { font-size: 20px; }
      .brand span, .nav-label { display: none; }
      .nav { display: flex; overflow: auto; }
      .nav button { flex-shrink: 0; padding: 9px 11px; }
      .nav-icon { display: none; }
      .session { display: flex; align-items: center; gap: 12px; padding: 10px; }
      .session select { margin-top: 0; flex: 1; width: auto; min-width: 0; }
      .session small { display: none; }
      .topbar { padding: 12px 18px; }
      .topbar > small { display: none; }
      .content { padding: 20px 15px; }
      .page-head { align-items: flex-start; }
      .page-head h1 { font-size: 23px; }
      .stats { gap: 10px; }
      .card { padding: 16px; }
      .stat .value { font-size: 27px; }
      .form-grid, .details { grid-template-columns: 1fr; }
      .modal-body { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <strong>PeopleCore<span style="color:#9496ff">.</span></strong>
        <span>HUMAN RESOURCE SYSTEM</span>
      </div>

      <div>
        <div class="nav-label">WORKSPACE</div>
        <nav id="nav" class="nav" aria-label="เมนูหลัก"></nav>
      </div>

      <div class="session">
        <div>
          <strong>Demo account</strong>
          <small style="display:block">สลับบัญชีเพื่อทดสอบหน้าจอ</small>
        </div>
        <select id="sessionSelect" aria-label="บัญชีจำลอง"></select>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <small>Workspace / Core HRIS</small>
        <div class="topbar-right">
          <span class="badge orange">MOCK DATA</span>
          <span id="currentUser"></span>
          <button class="btn small" data-action="reset">รีเซ็ต Demo</button>
        </div>
      </header>

      <div class="content">
        <div class="notice">
          ระบบต้นแบบสำหรับข้อมูลสมมติเท่านั้น — สิทธิ์ถูกจำลองบนหน้าจอ
          ข้อมูลอยู่ใน localStorage และไฟล์แนบเก็บในหน่วยความจำชั่วคราว
        </div>
        <div id="view"></div>
      </div>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="modalTitle"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    // ------------------------------------------------------------
    // Utilities
    // ------------------------------------------------------------

    const STORAGE_KEY = "peoplecore-demo-v1";
    const $ = selector => document.querySelector(selector);
    const uid = () => crypto.randomUUID();
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    }[char]));

    function today() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }

    const dateText = value => value
      ? new Date(value + "T00:00:00").toLocaleDateString("th-TH", {
          day: "numeric", month: "short", year: "numeric"
        })
      : "—";

    const timeText = value => new Date(value).toLocaleString("th-TH");
    const money = value => new Intl.NumberFormat("th-TH", {
      style: "currency", currency: "THB", maximumFractionDigits: 0
    }).format(Number(value || 0));

    function toast(message) {
      $("#toast").textContent = message;
      $("#toast").classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => $("#toast").classList.remove("show"), 3500);
    }

    // ------------------------------------------------------------
    // Mock database: all people and identifiers are fictional.
    // ------------------------------------------------------------

    function createSeed() {
      const departments = [
        { id: "d1", name: "Corporate", type: "BU", parentId: "" },
        { id: "d2", name: "People & Culture", type: "ฝ่าย", parentId: "d1" },
        { id: "d3", name: "Technology", type: "ฝ่าย", parentId: "d1" },
        { id: "d4", name: "Engineering", type: "แผนก", parentId: "d3" },
        { id: "d5", name: "Product Design", type: "แผนก", parentId: "d3" },
        { id: "d6", name: "Finance", type: "ฝ่าย", parentId: "d1" }
      ];

      const grades = [
        { id: "g1", code: "L1", name: "Associate", rank: 1 },
        { id: "g2", code: "L2", name: "Specialist", rank: 2 },
        { id: "g3", code: "L3", name: "Senior", rank: 3 },
        { id: "g4", code: "L4", name: "Manager", rank: 4 },
        { id: "g5", code: "L5", name: "Director", rank: 5 }
      ];

      const rows = [
        ["e1", "EMP-001", "นที", "ตัวอย่าง", "Director", "d1", "g5", "", 110000, "2021-01-11", "ประจำ"],
        ["e2", "EMP-002", "พิมพ์ใจ", "ข้อมูลสมมติ", "HR Manager", "d2", "g4", "e1", 68000, "2021-05-10", "ประจำ"],
        ["e3", "EMP-003", "ธนา", "ทดสอบระบบ", "Engineering Manager", "d4", "g4", "e1", 82000, "2022-02-14", "ประจำ"],
        ["e4", "EMP-004", "มินตรา", "ตัวอย่าง", "Frontend Developer", "d4", "g2", "e3", 38000, "2023-03-01", "ประจำ"],
        ["e5", "EMP-005", "กวิน", "ข้อมูลสมมติ", "Backend Developer", "d4", "g3", "e3", 58000, "2022-09-05", "ประจำ"],
        ["e6", "EMP-006", "อริสา", "ทดสอบระบบ", "Product Designer", "d5", "g2", "e1", 41000, "2023-06-12", "สัญญาจ้าง"],
        ["e7", "EMP-007", "ปกรณ์", "ตัวอย่าง", "Finance Specialist", "d6", "g2", "e1", 39000, "2023-07-03", "ประจำ"],
        ["e8", "EMP-008", "ลลิตา", "ข้อมูลสมมติ", "HR Coordinator", "d2", "g1", "e2", 26000, "2023-08-01", "ชั่วคราว"]
      ];

      const employees = rows.map((r, index) => ({
        id: r[0],
        code: r[1],
        firstName: r[2],
        lastName: r[3],
        birthDate: `199${index}-04-12`,
        email: `employee${index + 1}@peoplecore.example`,
        phone: `DEMO-PHONE-${index + 1}`,
        address: `ที่อยู่สมมติสำหรับทดสอบ ลำดับ ${index + 1}`,
        startDate: r[9],
        endDate: index === 7 ? "2024-10-31" : "",
        archived: false,
        insurance: "แผนสุขภาพตัวอย่าง A",
        benefits: "ประกันสุขภาพ, ตรวจสุขภาพประจำปี, อบรมพัฒนาทักษะ",
        hrNotes: "ข้อมูลสมมติสำหรับทดสอบ ห้ามใช้แทนข้อมูลจริง",
        events: [{
          id: `initial-${r[0]}`,
          effective: r[9],
          seq: index + 1,
          type: "เริ่มงาน",
          changes: {
            title: r[4],
            departmentId: r[5],
            gradeId: r[6],
            managerId: r[7],
            salary: r[8],
            employmentType: r[10]
          },
          reason: "สร้างข้อมูลเริ่มต้น",
          recordedAt: "2024-01-01T09:00:00.000Z",
          recordedBy: "Mock seed"
        }]
      }));

      employees[3].events.push({
        id: "promotion-e4",
        effective: "2024-04-01",
        seq: 9,
        type: "เลื่อนตำแหน่ง",
        changes: {
          title: "Senior Frontend Developer",
          gradeId: "g3",
          salary: 48000
        },
        reason: "ผ่านการประเมินทักษะตามข้อมูลสมมติ",
        recordedAt: "2024-03-20T09:00:00.000Z",
        recordedBy: "HR Demo"
      });

      return {
        version: 1,
        seq: 9,
        departments,
        grades,
        employees,
        accounts: [
          { id: "a1", username: "admin.demo", role: "Admin", employeeId: "e1", active: true },
          { id: "a2", username: "hr.demo", role: "HR", employeeId: "e2", active: true },
          { id: "a3", username: "manager.demo", role: "Manager", employeeId: "e3", active: true },
          { id: "a4", username: "employee.demo", role: "Employee", employeeId: "e4", active: true }
        ],
        documents: [],
        audit: []
      };
    }

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createSeed();
        const data = JSON.parse(raw);
        if (
          data.version !== 1 ||
          !Array.isArray(data.employees) ||
          !Array.isArray(data.accounts) ||
          !Array.isArray(data.departments) ||
          !Array.isArray(data.grades) ||
          !Array.isArray(data.documents) ||
          !Array.isArray(data.audit)
        ) {
          throw new Error("Invalid demo database");
        }
        return data;
      } catch {
        return createSeed();
      }
    }

    let db = loadDatabase();
    let accountId = db.accounts.find(a => a.active)?.id || "";
    let page = "dashboard";
    let profileId = "";
    let profileTab = "overview";
    let filters = { q: "", department: "", status: "", page: 1 };

    // Actual File objects are intentionally not persisted in localStorage.
    const sessionFiles = new Map();

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        return true;
      } catch {
        toast("บันทึกในเบราว์เซอร์ไม่ได้ ข้อมูลรอบนี้อยู่ในหน่วยความจำเท่านั้น");
        return false;
      }
    }

    const me = () => db.accounts.find(a => a.id === accountId && a.active);
    const isHR = () => ["Admin", "HR"].includes(me()?.role);
    const isAdmin = () => me()?.role === "Admin";
    const employee = id => db.employees.find(e => e.id === id);
    const fullName = e => e ? `${e.firstName} ${e.lastName}` : "ไม่ระบุ";
    const deptName = id => db.departments.find(d => d.id === id)?.name || "ไม่ระบุ";
    const gradeName = id => {
      const g = db.grades.find(g => g.id === id);
      return g ? `${g.code} · ${g.name}` : "ไม่ระบุ";
    };

    function audit(action, target) {
      db.audit.unshift({
        id: uid(),
        at: new Date().toISOString(),
        actor: me()?.username || "Demo",
        action,
        target
      });
    }

    // ------------------------------------------------------------
    // Effective-dated job history
    // Only changed fields are stored; later unrelated events survive.
    // ------------------------------------------------------------

    function sortedEvents(e) {
      return [...e.events].sort((a, b) =>
        a.effective.localeCompare(b.effective) || a.seq - b.seq
      );
    }

    function jobAt(e, at = today()) {
      if (!e) return {};
      return sortedEvents(e)
        .filter(event => event.effective <= at)
        .reduce((result, event) => ({ ...result, ...event.changes }), {});
    }

    function statusOf(e, at = today()) {
      if (e.archived) return "archived";
      if (e.startDate > at) return "upcoming";
      // endDate is the last employed day, inclusive.
      if (e.endDate && e.endDate < at) return "ended";
      return "active";
    }

    const statusLabels = {
      active: "ปฏิบัติงาน",
      upcoming: "รอเริ่มงาน",
      ended: "สิ้นสุดงาน",
      archived: "จัดเก็บแล้ว"
    };

    function statusBadge(e) {
      const s = statusOf(e);
      const color = {
        active: "green", upcoming: "purple", ended: "orange", archived: "red"
      }[s];
      return `<span class="badge ${color}">${statusLabels[s]}</span>`;
    }

    function reportingTo(targetId, managerId) {
      const seen = new Set();
      let current = targetId;
      while (current && !seen.has(current)) {
        seen.add(current);
        const parent = jobAt(employee(current)).managerId;
        if (!parent) return false;
        if (parent === managerId) return true;
        current = parent;
      }
      return false;
    }

    function scopedEmployees() {
      const user = me();
      if (!user) return [];
      if (isHR()) return db.employees;

      return db.employees.filter(e => {
        if (e.archived) return false;
        if (e.id === user.employeeId) return true;
        return user.role === "Manager" &&
          statusOf(e) === "active" &&
          reportingTo(e.id, user.employeeId);
      });
    }

    const canSeeEmployee = id => scopedEmployees().some(e => e.id === id);
    const canSeePrivate = e => isHR() || me()?.employeeId === e.id;
    const canSeeSalary = e => canSeePrivate(e);

    function canReadDocument(doc) {
      if (!canSeeEmployee(doc.employeeId)) return false;
      if (isHR()) return true;
      if (doc.audience === "hr") return false;
      if (me()?.employeeId === doc.employeeId) return true;
      return me()?.role === "Manager" && doc.audience === "team";
    }

    // Verify reporting lines at every effective-date boundary.
    function validateReportingGraph() {
      const dates = [...new Set(
        db.employees.flatMap(e => e.events.map(v => v.effective))
      )].sort();

      for (const at of dates) {
        const parents = new Map(
          db.employees.map(e => [e.id, jobAt(e, at).managerId || ""])
        );

        for (const e of db.employees) {
          const seen = new Set();
          let current = e.id;

          while (current) {
            if (seen.has(current)) {
              throw new Error(`สายบังคับบัญชาเป็นวงวน ณ ${dateText(at)}`);
            }
            seen.add(current);
            current = parents.get(current) || "";
            if (current && !employee(current)) {
              throw new Error("ไม่พบพนักงานที่ถูกกำหนดเป็นผู้บังคับบัญชา");
            }
          }
        }
      }
    }

    function validateDepartmentTree() {
      for (const dept of db.departments) {
        const seen = new Set();
        let current = dept.id;
        while (current) {
          if (seen.has(current)) throw new Error("โครงสร้างหน่วยงานเป็นวงวน");
          seen.add(current);
          const d = db.departments.find(item => item.id === current);
          if (!d) throw new Error("ไม่พบหน่วยงานแม่");
          current = d.parentId;
        }
      }
    }

    const field = (label, name, value = "", type = "text", attrs = "") =>
      `<label class="field">${esc(label)}
        <input name="${esc(name)}" type="${esc(type)}" value="${esc(value)}" ${attrs}>
      </label>`;

    const textarea = (label, name, value = "", attrs = "") =>
      `<label class="field full">${esc(label)}

      </label>`;

    function selectField(label, name, value, options, attrs = "") {
      return `<label class="field">${esc(label)}
        <select name="${esc(name)}" ${attrs}>
          ${options.map(([v, text]) => `
            <option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>

      return `<div class="details">${items.map(([label, value]) => `

        </div>`).join("")}</div>`;
    }

    function head(title, description, action = "") {
      return `<div class="page-head">
        <div><h1>${esc(title)}</h1><p>${esc(description)}</p></div>
        ${action}
      </div>`;
    }

    function personCell(e) {
      return `<div class="person">
        <div class="avatar">${esc(e.firstName.slice(0, 1))}</div>
        <div>
          <button class="link-button" data-action="profile" data-id="${esc(e.id)}">
            <strong>${esc(fullName(e))}</strong>
          </button>
          <small style="display:block">${esc(e.code)}</small>
        </div>
      </div>`;
    }

    function renderShell() {

        ["organization", "โครงสร้างองค์กร", "03"],

      $("#nav").innerHTML = menu.map(([key, label, icon]) => `

      $("#sessionSelect").innerHTML = db.accounts.filter(a => a.active).map(a => `

    }

    function render() {
      if (!me()) accountId = db.accounts.find(a => a.active)?.id || "";
      if (page === "accounts" && !isAdmin()) page = "dashboard";
      if (page === "audit" && !isHR()) page = "dashboard";
      if (page === "profile" && !canSeeEmployee(profileId)) page = "employees";

      renderShell();

      const views = {
        dashboard: renderDashboard,
        employees: renderEmployees,
        organization: renderOrganization,
        accounts: renderAccounts,
        audit: renderAudit,
        profile: renderProfile
      };

      $("#view").innerHTML = (views[page] || renderDashboard)();
    }

    function renderDashboard() {
      const visible = scopedEmployees().filter(e => !e.archived);
      const active = visible.filter(e => statusOf(e) === "active");
      const upcoming = visible.filter(e => statusOf(e) === "upcoming");
      const ended = visible.filter(e => statusOf(e) === "ended");

      const cards = [
        ["พนักงานในขอบเขตสิทธิ์", visible.length, "ไม่รวมโปรไฟล์ที่จัดเก็บ", "P"],
        ["ปฏิบัติงาน", active.length, "ตามวันเริ่มและวันสิ้นสุดงาน", "A"],
        ["รอเริ่มงาน", upcoming.length, "มีวันเริ่มงานในอนาคต", "N"],
        ["สิ้นสุดงาน", ended.length, "คงประวัติไว้เพื่ออ้างอิง", "E"]
      ];

      const groups = db.departments.map(d => ({
        ...d,
        count: active.filter(e => jobAt(e).departmentId === d.id).length
      })).filter(d => d.count);

      const recent = visible.flatMap(e => e.events.map(event => ({ e, event })))
        .sort((a, b) =>
          b.event.recordedAt.localeCompare(a.event.recordedAt) ||
          b.event.seq - a.event.seq
        ).slice(0, 6);

      return head(
        "ภาพรวมบุคลากร",
        "ศูนย์กลางข้อมูลพนักงานและโครงสร้างองค์กร",
        isHR() ? button("+ เพิ่มพนักงาน", "employee-add", "", "primary") : ""
      ) + `
        <div class="stats">
          ${cards.map(([label, value, note, mark]) => `
            <section class="card stat">
              <div class="stat-top"><span class="muted">${label}</span>
                <span class="stat-mark">${mark}</span>
              </div>
              <div class="value">${value}</div>
              <small>${note}</small>
            </section>`).join("")}
        </div>

        <div class="two-col">
          <section class="card">
            <div class="card-head">
              <h2>พนักงานตามหน่วยงาน</h2>${badge("Active only", "green")}

            ${groups.length ? groups.map(d => `
              <div class="bar-row">
                <div class="bar-label">
                  <span>${esc(d.name)}</span><strong>${d.count} คน</strong>

          <section class="card">
            <h2>รายการข้อมูลงานที่บันทึกล่าสุด</h2>
            ${recent.length ? recent.map(({ e, event }) => `
              <div style="padding:11px 0;border-bottom:1px solid var(--line)">
                <div class="card-head" style="margin-bottom:3px">
                  <button class="link-button" data-action="profile" data-id="${esc(e.id)}">
                    ${esc(fullName(e))}
                  </button>
                  ${badge(event.type)}
                </div>
                <small>มีผล ${dateText(event.effective)}
                  ${event.effective > today() ? "· รายการล่วงหน้า" : ""}
                </small>
              </div>`).join("") : empty("ยังไม่มีรายการ")}
          </section>
        </div>`;
    }

    function renderEmployees() {
      const q = filters.q.toLocaleLowerCase().trim();
      let rows = scopedEmployees().filter(e => {
        const job = jobAt(e);
        const text = `${e.code} ${fullName(e)} ${job.title || ""}`.toLocaleLowerCase();

          (!filters.department || job.departmentId === filters.department) &&
          (filters.status ? statusOf(e) === filters.status : !e.archived);

      const total = rows.length;
      const pageSize = 6;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      filters.page = Math.max(1, Math.min(filters.page, totalPages));
      rows = rows.slice((filters.page - 1) * pageSize, filters.page * pageSize);

      return head(
        "พนักงาน",
        "ค้นหาและจัดการข้อมูลบุคลากรจากฐานข้อมูลกลาง",
        isHR() ? button("+ เพิ่มพนักงาน", "employee-add", "", "primary") : ""
      ) + `
        <section class="card">
          <div class="toolbar">
            <input class="search" id="searchInput" data-filter="q"

                    <td>${button("ดูโปรไฟล์", "profile", e.id, "small")}</td>

                }).join("")}

            ${!rows.length ? empty("ไม่พบพนักงานตามเงื่อนไข") : ""}

          <div class="pagination">

              <button class="btn small" data-action="next" ${filters.page >= totalPages ? "disabled" : ""}>ถัดไป</button>
            </div>
          </div>
        </section>`;
    }

    function renderOrganization() {
      const visible = scopedEmployees().filter(e => statusOf(e) === "active");
      const visibleIds = new Set(visible.map(e => e.id));

      function departmentNodes(parentId, seen = new Set()) {
        return db.departments.filter(d => d.parentId === parentId && !seen.has(d.id))
          .map(d => {
            const next = new Set(seen).add(d.id);
            const children = departmentNodes(d.id, next);
            const count = visible.filter(e => jobAt(e).departmentId === d.id).length;
            return `<li>
              <span class="tree-node"><strong>${esc(d.name)}</strong>
                ${badge(d.type)} <small>· ${count} คนในสิทธิ์</small>
              </span>
              ${children ? `<ul>${children}</ul>` : ""}
            </li>`;
          }).join("");
      }

      function employeeNodes(parentId, seen = new Set()) {
        return visible.filter(e => {
          const managerId = jobAt(e).managerId || "";
          const isRoot = !managerId || !visibleIds.has(managerId);
          return !seen.has(e.id) && (parentId === "" ? isRoot : managerId === parentId);
        }).map(e => {
          const next = new Set(seen).add(e.id);
          const children = employeeNodes(e.id, next);

            <span class="tree-node">
              <button class="link-button" data-action="profile" data-id="${esc(e.id)}">
                ${esc(fullName(e))}
              </button>
              <small style="display:block">${esc(jobAt(e).title)}</small>

    function requiredText(value, label) {
      if (!String(value ?? "").trim()) throw new Error(`กรุณาระบุ${label}`);
    }

    function readJob(values) {
      const result = {
        title: values.title?.trim(),
        departmentId: values.departmentId,
        gradeId: values.gradeId,
        managerId: values.managerId || "",
        employmentType: values.employmentType,
        salary: Number(values.salary)
      };

      requiredText(result.title, "ตำแหน่ง");
      if (!db.departments.some(d => d.id === result.departmentId)) {
        throw new Error("กรุณาเลือกหน่วยงานที่ถูกต้อง");
      }
      if (!db.grades.some(g => g.id === result.gradeId)) {
        throw new Error("กรุณาเลือก Grade ที่ถูกต้อง");
      }
      if (result.managerId && !employee(result.managerId)) {
        throw new Error("ไม่พบผู้บังคับบัญชา");
      }
      if (!["ประจำ", "สัญญาจ้าง", "ชั่วคราว"].includes(result.employmentType)) {
        throw new Error("รูปแบบการจ้างไม่ถูกต้อง");
      }
      if (!Number.isFinite(result.salary) || result.salary < 0 || result.salary > 100000000) {
        throw new Error("เงินเดือนต้องเป็นตัวเลขระหว่าง 0 ถึง 100,000,000");
      }
      return result;
    }

    function makeEvent(effective, type, changes, reason) {
      return {
        id: uid(),
        effective,
        type,
        changes,
        reason,
        seq: ++db.seq,
        recordedAt: new Date().toISOString(),
        recordedBy: me()?.username || "Demo"
      };
    }

    function saveEmployee(id, values) {
      const old = id ? employee(id) : null;
      if (id && (!old || old.archived)) throw new Error("ไม่สามารถแก้ไขโปรไฟล์นี้");

      ["code", "firstName", "lastName", "startDate"].forEach(key =>
        requiredText(values[key], key)
      );

      const code = values.code.trim();
      if (db.employees.some(e => e.id !== id && e.code.toLowerCase() === code.toLowerCase())) {
        throw new Error("เลขพนักงานนี้มีอยู่แล้ว");
      }
      if (old && values.startDate !== old.startDate) {
        throw new Error("Prototype ไม่อนุญาตแก้วันเริ่มงานหลังสร้างประวัติ");
      }
      if (values.birthDate && values.birthDate >= values.startDate) {
        throw new Error("วันเกิดต้องอยู่ก่อนวันที่เริ่มงาน");
      }
      if (values.birthDate && values.birthDate > today()) {
        throw new Error("วันเกิดไม่สามารถเป็นวันในอนาคต");
      }
      if (values.endDate && values.endDate < values.startDate) {
        throw new Error("วันสิ้นสุดงานต้องไม่ก่อนวันเริ่มงาน");
      }
      if (old && values.endDate && old.events.some(v => v.effective > values.endDate)) {
        throw new Error("มีประวัติข้อมูลงานหลังวันสิ้นสุดงานที่ระบุ");
      }

      const record = {
        ...(old || { id: uid(), archived: false, events: [] }),
        code,
        firstName: values.firstName.trim(),
        lastName: values.lastName.trim(),
        birthDate: values.birthDate,
        email: values.email.trim(),
        phone: values.phone.trim(),
        address: values.address.trim(),
        startDate: values.startDate,
        endDate: values.endDate,
        insurance: values.insurance.trim(),
        benefits: values.benefits.trim(),
        hrNotes: values.hrNotes.trim()
      };

      if (old) {
        db.employees[db.employees.findIndex(e => e.id === id)] = record;
      } else {
        record.events.push(makeEvent(
          record.startDate, "เริ่มงาน", readJob(values), "สร้างโปรไฟล์พนักงาน"
        ));
        db.employees.push(record);
      }

      validateReportingGraph();
      audit(old ? "แก้ไขข้อมูลพนักงาน" : "เพิ่มพนักงาน", record.code);
    }

    function saveJob(id, values) {
      const e = employee(id);
      if (!e || e.archived) throw new Error("ไม่พบพนักงานที่แก้ไขได้");

      requiredText(values.reason, "เหตุผล");
      if (!values.effective || values.effective < e.startDate) {
        throw new Error("วันที่มีผลต้องไม่ก่อนวันเริ่มงาน");
      }
      if (e.endDate && values.effective > e.endDate) {
        throw new Error("วันที่มีผลต้องไม่หลังวันสิ้นสุดงาน");
      }

      const prior = jobAt(e, values.effective);
      const next = readJob(values);
      if (next.managerId === e.id) throw new Error("พนักงานเป็นผู้บังคับบัญชาตนเองไม่ได้");

      const changes = Object.fromEntries(
        Object.entries(next).filter(([key, value]) => value !== prior[key])
      );
      if (!Object.keys(changes).length) throw new Error("ยังไม่มีข้อมูลงานที่เปลี่ยนแปลง");

      e.events.push(makeEvent(
        values.effective, values.type, changes, values.reason.trim()
      ));

      validateReportingGraph();
      audit("เพิ่มประวัติข้อมูลงาน", `${e.code} · มีผล ${values.effective}`);
    }

    function saveDepartment(id, values) {
      requiredText(values.name, "ชื่อหน่วยงาน");
      const record = {
        id: id || uid(),
        name: values.name.trim(),
        type: values.type,
        parentId: values.parentId || ""
      };

      if (db.departments.some(d =>
        d.id !== id &&
        d.parentId === record.parentId &&
        d.name.toLowerCase() === record.name.toLowerCase()
      )) {
        throw new Error("ชื่อหน่วยงานซ้ำภายใต้หน่วยงานแม่เดียวกัน");
      }

      const index = db.departments.findIndex(d => d.id === id);
      if (index >= 0) db.departments[index] = record;
      else db.departments.push(record);

      validateDepartmentTree();
      audit(id ? "แก้ไขหน่วยงาน" : "เพิ่มหน่วยงาน", record.name);
    }

    function saveGrade(id, values) {
      requiredText(values.code, "Code");
      requiredText(values.name, "ชื่อ Grade");
      const rank = Number(values.rank);
      if (!Number.isInteger(rank) || rank < 1 || rank > 999) {
        throw new Error("ลำดับ Grade ต้องเป็นจำนวนเต็ม 1–999");
      }
      if (db.grades.some(g =>
        g.id !== id && g.code.toLowerCase() === values.code.trim().toLowerCase()
      )) {
        throw new Error("Code ของ Grade ซ้ำ");
      }
      const record = {
        id: id || uid(), code: values.code.trim(),
        name: values.name.trim(), rank
      };
      const index = db.grades.findIndex(g => g.id === id);
      if (index >= 0) db.grades[index] = record;
      else db.grades.push(record);
      audit(id ? "แก้ไข Grade" : "เพิ่ม Grade", record.code);
    }

    function saveAccount(id, values) {
      const username = values.username.trim();
      if (!/^[A-Za-z0-9._-]+$/.test(username)) {
        throw new Error("Username ใช้ตัวอักษรอังกฤษ ตัวเลข จุด ขีดกลาง และขีดล่างเท่านั้น");
      }
      if (db.accounts.some(a =>
        a.id !== id && a.username.toLowerCase() === username.toLowerCase()
      )) {
        throw new Error("Username นี้มีอยู่แล้ว");
      }
      if (!["Admin", "HR", "Manager", "Employee"].includes(values.role)) {
        throw new Error("Role ไม่ถูกต้อง");
      }
      if (["Manager", "Employee"].includes(values.role) && !values.employeeId) {
        throw new Error("Manager และ Employee ต้องเชื่อมกับพนักงาน");
      }
      if (values.employeeId && !employee(values.employeeId)) {
        throw new Error("ไม่พบพนักงานที่เลือก");
      }
      if (values.employeeId && db.accounts.some(a =>
        a.id !== id && a.employeeId === values.employeeId
      )) {
        throw new Error("พนักงานนี้เชื่อมกับบัญชีอื่นแล้ว");
      }

      const record = {
        id: id || uid(),
        username,
        role: values.role,
        employeeId: values.employeeId || "",
        active: values.active === "true"
      };

      if (record.active && employee(record.employeeId)?.archived) {
        throw new Error("เปิดบัญชีของพนักงานที่จัดเก็บแล้วไม่ได้");
      }

      const nextAccounts = db.accounts.filter(a => a.id !== id).concat(record);
      if (!nextAccounts.some(a => a.active && a.role === "Admin")) {
        throw new Error("ต้องมี Admin ที่เปิดใช้งานอย่างน้อยหนึ่งบัญชี");
      }

      // Audit before replacing the current account.
      audit(id ? "แก้ไขบัญชีผู้ใช้" : "เพิ่มบัญชีผู้ใช้", username);
      db.accounts = nextAccounts;
    }

    function saveDocument(id, values, form) {
      const e = employee(id);
      if (!e || e.archived) throw new Error("ไม่สามารถแนบไฟล์ให้พนักงานนี้");

      const file = form.elements.file.files[0];
      if (!file) throw new Error("กรุณาเลือกไฟล์");
      if (file.size <= 0 || file.size > 10 * 1024 * 1024) {
        throw new Error("ไฟล์ต้องมีขนาดมากกว่า 0 และไม่เกิน 10 MB");
      }
      if (!/\.(pdf|png|jpe?g)$/i.test(file.name)) {
        throw new Error("รองรับเฉพาะ PDF / PNG / JPEG");
      }
      if (file.type && !["application/pdf", "image/png", "image/jpeg"].includes(file.type)) {
        throw new Error("ชนิดไฟล์ไม่ตรงกับประเภทที่รองรับ");
      }

      const doc = {
        id: uid(),
        employeeId: id,
        name: file.name,
        size: file.size,
        mime: file.type,
        type: values.type,
        audience: values.type === "ใบเตือน" ? "hr" : values.audience,
        createdAt: new Date().toISOString(),
        createdBy: me().username
      };

      db.documents.push(doc);
      sessionFiles.set(doc.id, file);
      audit("แนบเอกสาร", `${e.code} · ${doc.type}`);
    }

    $("#modal").addEventListener("submit", event => {
      event.preventDefault();
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (!form.reportValidity()) return;

      const snapshot = structuredClone(db);
      const values = Object.fromEntries(new FormData(form).entries());
      const kind = form.dataset.kind;
      const id = form.dataset.id;

      try {
        if (kind === "account" ? !isAdmin() : !isHR()) {
          throw new Error("ไม่มีสิทธิ์ดำเนินการ");
        }

        const handlers = {
          employee: saveEmployee,
          job: saveJob,
          department: saveDepartment,
          grade: saveGrade,
          account: saveAccount,
          document: saveDocument
        };
        if (!handlers[kind]) throw new Error("ไม่พบแบบฟอร์ม");
        handlers[kind](id, values, form);

        const stored = persist();
        $("#modal").close();
        render();
        if (stored) toast("บันทึกข้อมูลเรียบร้อย");
      } catch (error) {
        db = snapshot;
        $("#formError").textContent = error.message;
        $("#formError").classList.add("show");
      }
    });

    // Changing the effective date reloads the historical baseline.
    $("#modal").addEventListener("change", event => {
      const form = event.target.closest("form");
      if (!form || form.dataset.kind !== "job" || event.target.name !== "effective") return;
      if (!event.target.value) return;

      const e = employee(form.dataset.id);
      const state = jobAt(e, event.target.value);

      for (const key of Object.keys(jobLabels)) {
        if (form.elements[key]) {
          form.elements[key].value = state[key] ?? (key === "salary" ? 0 : "");
        }
      }
    });

    // ------------------------------------------------------------
    // Archive, reference protection and document download
    // ------------------------------------------------------------

    function archiveEmployee(id, restore = false) {
      if (!isHR()) return;
      const e = employee(id);
      if (!e) return;

      if (restore) {
        e.archived = false;
        audit("นำโปรไฟล์กลับจากคลัง", e.code);
      } else {
        if (!e.endDate || e.endDate >= today()) {
          throw new Error("กรุณาระบุวันสิ้นสุดงานที่ผ่านไปแล้วก่อนจัดเก็บโปรไฟล์");
        }
        if (db.accounts.some(a => a.employeeId === id && a.active)) {
          throw new Error("กรุณาให้ Admin ปิดบัญชีที่เชื่อมกับพนักงานก่อน");
        }
        if (db.employees.some(other =>
          other.id !== id && !other.archived &&
          statusOf(other) === "active" &&
          reportingTo(other.id, id)
        )) {
          throw new Error("ยังมีพนักงานปฏิบัติงานอยู่ใต้บังคับบัญชา กรุณาย้ายสายงานก่อน");
        }
        if (!confirm(`จัดเก็บโปรไฟล์ ${e.code} โดยยังคงประวัติไว้?`)) return;
        e.archived = true;
        audit("จัดเก็บโปรไฟล์พนักงาน", e.code);
      }

      const stored = persist();
      render();
      if (stored) toast(restore ? "นำโปรไฟล์กลับแล้ว" : "จัดเก็บโปรไฟล์แล้ว");
    }

    function deleteMaster(type, id) {
      if (!isHR()) return;
      const isDepartment = type === "department";
      const key = isDepartment ? "departmentId" : "gradeId";
      const collection = isDepartment ? "departments" : "grades";
      const item = db[collection].find(row => row.id === id);
      if (!item) return;

      if (db.employees.some(e => e.events.some(v => v.changes[key] === id))) {
        throw new Error("ลบไม่ได้ เนื่องจากมีประวัติพนักงานอ้างอิงรายการนี้");
      }
      if (isDepartment && db.departments.some(d => d.parentId === id)) {
        throw new Error("ลบไม่ได้ เนื่องจากยังมีหน่วยงานย่อย");
      }
      if (!confirm(`ยืนยันลบ ${item.name}?`)) return;

      db[collection] = db[collection].filter(row => row.id !== id);
      audit(isDepartment ? "ลบหน่วยงาน" : "ลบ Grade", item.name);
      const stored = persist();
      render();
      if (stored) toast("ลบรายการแล้ว");
    }

    function downloadDocument(id) {
      const doc = db.documents.find(d => d.id === id);
      if (!doc || !canReadDocument(doc)) throw new Error("ไม่มีสิทธิ์เข้าถึงเอกสาร");
      const file = sessionFiles.get(id);
      if (!file) throw new Error("ไฟล์ไม่อยู่ในรอบการใช้งานนี้ กรุณาแนบใหม่");

      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = doc.name;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    // ------------------------------------------------------------
    // Event delegation
    // ------------------------------------------------------------

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      try {
        switch (action) {
          case "nav":
            page = id;
            render();
            break;
          case "profile":
            if (!canSeeEmployee(id)) throw new Error("ไม่มีสิทธิ์ดูพนักงานนี้");
            profileId = id;
            profileTab = "overview";
            page = "profile";
            render();
            break;
          case "profile-tab":
            profileTab = id;
            render();
            break;
          case "prev":
            filters.page--;
            render();
            break;
          case "next":
            filters.page++;
            render();
            break;
          case "employee-add":
            employeeForm();
            break;
          case "employee-edit":
            employeeForm(id);
            break;
          case "job-change":
            jobForm(id);
            break;
          case "employee-archive":
            archiveEmployee(id);
            break;
          case "employee-restore":
            archiveEmployee(id, true);
            break;
          case "department-add":
            departmentForm();
            break;
          case "department-edit":
            departmentForm(id);
            break;
          case "department-delete":
            deleteMaster("department", id);
            break;
          case "grade-add":
            gradeForm();
            break;
          case "grade-edit":
            gradeForm(id);
            break;
          case "grade-delete":
            deleteMaster("grade", id);
            break;
          case "account-add":
            accountForm();
            break;
          case "account-edit":
            accountForm(id);
            break;
          case "document-add":
            documentForm(id);
            break;
          case "document-download":
            downloadDocument(id);
            break;
          case "document-delete": {
            if (!isHR()) throw new Error("ไม่มีสิทธิ์ลบเอกสาร");
            const doc = db.documents.find(d => d.id === id);
            if (!doc || !confirm("ยืนยันลบเอกสารและข้อมูลกำกับไฟล์?")) return;
            audit("ลบเอกสาร", `${employee(doc.employeeId)?.code || ""} · ${doc.type}`);
            db.documents = db.documents.filter(d => d.id !== id);
            sessionFiles.delete(id);
            const stored = persist();
            render();
            if (stored) toast("ลบเอกสารแล้ว");
            break;
          }
          case "modal-close":
            $("#modal").close();
            break;
          case "reset":
            if (!confirm("ล้างข้อมูล Demo และกลับไปใช้ข้อมูลเริ่มต้น?")) return;
            db = createSeed();
            accountId = "a1";
            page = "dashboard";
            filters = { q: "", department: "", status: "", page: 1 };
            sessionFiles.clear();
            {
              const stored = persist();
              render();
              if (stored) toast("รีเซ็ตข้อมูล Demo แล้ว");
            }
            break;
        }
      } catch (error) {
        toast(error.message);
      }
    });

    $("#sessionSelect").addEventListener("change", event => {
      accountId = event.target.value;
      page = "dashboard";
      profileId = "";
      filters = { q: "", department: "", status: "", page: 1 };
      $("#modal").close();
      render();
      toast(`เปลี่ยนมุมมองเป็น ${me()?.role || "Demo"}`);
    });

    $("#view").addEventListener("change", event => {
      const key = event.target.dataset.filter;
      if (!key || key === "q") return;
      filters[key] = event.target.value;
      filters.page = 1;
      render();
    });

    $("#view").addEventListener("input", event => {
      if (event.target.dataset.filter !== "q") return;
      const value = event.target.value;
      const position = event.target.selectionStart;
      filters.q = value;
      filters.page = 1;
      render();

      const input = $("#searchInput");
      if (input) {
        input.focus();
        input.setSelectionRange(position, position);
      }
    });

    // Native dialog supports Escape; close on a true backdrop click.
    $("#modal").addEventListener("click", event => {
      if (event.target !== $("#modal")) return;
      const rect = $("#modal").getBoundingClientRect();
      const outside = event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom;
      if (outside) $("#modal").close();
    });

    render();
  </script>
</body>
</html>
